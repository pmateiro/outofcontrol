[project]
name = "outofcontrol"
version = "0.1.0"
description = "General-purpose agent with skills, tools, and swappable LLM providers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "httpx>=0.28.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pyyaml>=6.0.2",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]
browser = [
    "playwright>=1.49.0",
]

[project.scripts]
outofcontrol = "outofcontrol.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outofcontrol"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
